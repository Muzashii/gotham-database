name: ci
on:
  push:
  pull_request:

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pytest>=8' 'jsonschema>=4.23'
      - name: checks (aspas, tokens, orçamento)
        run: python build/checks.py
      - name: TMDL gerado está atualizado
        run: |
          python build/build_model.py
          python build/build_report.py
          git diff --exit-code -- powerbi
      - run: python -m pytest

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test

  # BPA (Tabular Editor 2 CLI) entra na F3, quando houver modelo em estrela.
